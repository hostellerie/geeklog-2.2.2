name: Maintenance versioning 1291

on:
  push:
    branches:
      - feature/1291-maintenance-versioning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip, openssl
      - run: php -v
      - run: php -l tests/maintenance-versioning-1291.php
      - run: php tests/maintenance-versioning-1291.php
      - run: php -l public_html/lib-common.php
      - run: php -l public_html/admin/install/classes/Common.php
      - run: php -l tests/maintenance-schema-1291.php
      - run: php tests/maintenance-schema-1291.php
      - run: php -l tests/maintenance-version-write-1291.php
      - run: php tests/maintenance-version-write-1291.php
      - run: php -l system/classes/UpdateCatalog.php
      - run: php -l tests/update-catalog-1291.php
      - run: php tests/update-catalog-1291.php
      - run: python3 tests/update-package-builder-1291.py "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdatePackage.php
      - run: php -l tests/update-package-1291.php
      - run: php tests/update-package-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdatePreflight.php
      - run: php -l tests/update-preflight-1291.php
      - run: php tests/update-preflight-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - name: Upload experimental fixture (not a release)
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: geeklog-2.2.3.1-experimental-fixture
          path: |
            ${{ runner.temp }}/geeklog-update-1291/geeklog-2.2.3.1.zip
            ${{ runner.temp }}/geeklog-update-1291/metadata.json
          retention-days: 7
