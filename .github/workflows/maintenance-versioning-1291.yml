name: Maintenance versioning 1291

on:
  push:
    branches:
      - feature/1291-maintenance-versioning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  versioning:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: zip, openssl, posix
      - run: php -v
      - run: php -l tests/maintenance-versioning-1291.php
      - run: php tests/maintenance-versioning-1291.php
      - run: php -l public_html/lib-common.php
      - run: php -l public_html/admin/install/classes/Common.php
      - run: php -l tests/maintenance-schema-1291.php
      - run: php tests/maintenance-schema-1291.php
      - run: php -l tests/maintenance-version-write-1291.php
      - run: php tests/maintenance-version-write-1291.php
      - run: php -l system/classes/UpdateCatalog.php
      - run: php -l tests/update-catalog-1291.php
      - run: php tests/update-catalog-1291.php
      - run: python3 tests/update-package-builder-1291.py "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l public_html/admin/coreupdates.php
      - run: php -l public_html/admin/index.php
      - run: php tests/update-admin-status-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdateCatalogStateLab.php
      - run: php tests/update-catalog-state-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdateHealthLab.php
      - run: php tests/update-health-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdatePackage.php
      - run: php -l tests/update-package-1291.php
      - run: php tests/update-package-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdatePreflight.php
      - run: php -l tests/update-preflight-1291.php
      - run: php tests/update-preflight-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdateTransactionLab.php
      - run: php -l tests/update-transaction-1291.php
      - run: php tests/update-transaction-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l tests/update-recovery-1291.php
      - run: php tests/update-recovery-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdateMaintenanceLab.php
      - run: php -l tests/update-maintenance-1291.php
      - run: php tests/update-maintenance-1291.php "$RUNNER_TEMP/geeklog-update-1291"
      - name: Upload experimental fixture (not a release)
        if: matrix.php == '8.4'
        uses: actions/upload-artifact@v4
        with:
          name: geeklog-2.2.3.1-experimental-fixture
          path: |
            ${{ runner.temp }}/geeklog-update-1291/geeklog-2.2.3.1.zip
            ${{ runner.temp }}/geeklog-update-1291/metadata.json
          retention-days: 7

  sql-schema:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [mysql, pgsql]
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_test_only
          MARIADB_DATABASE: geeklog_lab
          MARIADB_USER: geeklog
          MARIADB_PASSWORD: geeklog_test_only
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
      pgsql:
        image: postgres:16
        env:
          POSTGRES_DB: geeklog_lab
          POSTGRES_USER: geeklog
          POSTGRES_PASSWORD: geeklog_test_only
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready -U geeklog -d geeklog_lab" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip, openssl, posix, pdo_mysql, pdo_pgsql
      - run: python3 tests/update-package-builder-1291.py "$RUNNER_TEMP/geeklog-update-1291"
      - run: php -l system/classes/UpdateSchemaLab.php
      - run: php tests/update-schema-sql-1291.php "$RUNNER_TEMP/geeklog-update-1291" "${{ matrix.database }}"

  https-staging:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: root_test_only
          MARIADB_DATABASE: geeklog_lab
          MARIADB_USER: geeklog
          MARIADB_PASSWORD: geeklog_test_only
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip, openssl, curl, pdo_mysql, posix
      - run: python3 tests/update-package-builder-1291.py "$RUNNER_TEMP/geeklog-update-1291"
      - run: |
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -addext subjectAltName=DNS:localhost -keyout "$RUNNER_TEMP/tls.key" -out "$RUNNER_TEMP/tls.pem"
          sudo python3 tests/update-download-server-1291.py "$RUNNER_TEMP/geeklog-update-1291/geeklog-2.2.3.1.zip" "$RUNNER_TEMP/tls.pem" "$RUNNER_TEMP/tls.key" &
          for i in {1..20}; do
            if curl --silent --fail --cacert "$RUNNER_TEMP/tls.pem" https://localhost/good.zip -o /dev/null; then break; fi
            sleep 1
          done
          php -l system/classes/UpdateDownloadLab.php
          php -d curl.cainfo="$RUNNER_TEMP/tls.pem" tests/update-download-1291.php "$RUNNER_TEMP/geeklog-update-1291"
          php -d curl.cainfo="$RUNNER_TEMP/tls.pem" tests/update-runner-1291.php "$RUNNER_TEMP/geeklog-update-1291"
