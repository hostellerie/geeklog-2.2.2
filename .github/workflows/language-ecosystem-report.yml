name: Language ecosystem report

on:
  push:
    branches:
      - lang
    paths:
      - 'tools/language-ecosystem.php'
      - 'tools/language-recommendations.php'
      - 'tools/bundled-language-audit.php'
      - 'tools/bundled-plugin-identical-allowlist.php'
      - 'plugins/**/language/**'
      - '.github/workflows/language-ecosystem-report.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ecosystem-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: lang

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Generate ecosystem report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEEKLOG_PLUGIN_ORG: Geeklog-Plugins
        run: php tools/check-languages.php --plugins --report=docs/language-status.md

      - name: Commit report when changed
        run: |
          if [ -z "$(git status --porcelain -- docs/language-status.md)" ]; then
            echo "No report changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/language-status.md
          git commit -m "lang: update language coverage report"
          git push origin HEAD:lang
