name: Language consistency check

on:
  push:
    branches:
      - lang
    paths:
      - 'language/**'
      - 'tools/check-languages.php'
      - 'tools/language-identical-allowlist.php'
      - 'tools/language-ecosystem.php'
      - 'tools/language-recommendations.php'
      - 'tools/bundled-language-audit.php'
      - 'tools/bundled-plugin-identical-allowlist.php'
      - 'tools/plugin-support-status.php'
      - 'tools/external-theme-language-audit.php'
      - 'tools/external-language-components.php'
      - '.github/workflows/language-check.yml'
  pull_request:
    paths:
      - 'language/**'
      - 'tools/check-languages.php'
      - 'tools/language-identical-allowlist.php'
      - 'tools/language-ecosystem.php'
      - 'tools/language-recommendations.php'
      - '.github/workflows/language-check.yml'
  workflow_dispatch:

jobs:
  language-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          coverage: none

      - name: Lint checker
        run: |
          php -l tools/check-languages.php
          php -l tools/language-ecosystem.php
          php -l tools/language-recommendations.php
          php -l tools/bundled-language-audit.php
          php -l tools/bundled-plugin-identical-allowlist.php
          php -l tools/plugin-support-status.php
          php -l tools/external-theme-language-audit.php
          php -l tools/external-language-components.php

      - name: Lint UTF-8 language files
        run: find language -maxdepth 1 -name '*_utf-8.php' -print0 | xargs -0 -n1 php -l

      - name: Check French translation
        run: php tools/check-languages.php language/french_france_utf-8.php

      - name: Check all UTF-8 languages
        if: always()
        run: php tools/check-languages.php
